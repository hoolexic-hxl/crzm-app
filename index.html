<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>成人之美 · 深源青创</title>
<style>
:root{
  --ink:#0B0B0C; --ink-2:#17171A; --paper:#FFFFFF; --bg:#F4F3F0;
  --gray:#6B675F; --light:#9A958B; --line:#E5E2DA; --line-dark:#2A2A2C;
  --gold:#A8722A; --gold-soft:#F6EDDD;
  --max:1120px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--max);margin:0 auto;padding:0 28px}
a{color:inherit}
::selection{background:var(--ink);color:#fff}

/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:40;transition:.35s}
header .bar{max-width:var(--max);margin:0 auto;padding:18px 28px;display:flex;align-items:center;gap:28px}
header.scrolled{background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
header.scrolled .brand b, header.scrolled nav a{color:var(--ink)}
header.scrolled nav a.on{color:var(--gold)}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;margin-right:auto}
.logo-slot{width:34px;height:34px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;border:1px solid rgba(255,255,255,.18)}
.logo-slot img{width:100%;height:100%;object-fit:contain;display:none}
.logo-slot .mark{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.02em}
header.scrolled .logo-slot{border-color:var(--line)}
.brand b{font-size:14.5px;font-weight:600;color:#fff;letter-spacing:.02em;line-height:1.3}
.brand small{display:block;font-size:9.5px;letter-spacing:.24em;color:rgba(255,255,255,.5);font-weight:400}
header.scrolled .brand small{color:var(--light)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{font-size:12.5px;color:rgba(255,255,255,.66);text-decoration:none;padding:7px 11px;border-radius:8px;transition:.2s;white-space:nowrap}
nav a:hover{color:#fff}
header.scrolled nav a:hover{color:var(--ink)}
nav a.on{color:#fff;background:rgba(255,255,255,.12)}
header.scrolled nav a.on{background:transparent;color:var(--gold);font-weight:600}
.hdr-btn{font:inherit;font-size:12px;padding:7px 13px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer;transition:.2s}
.hdr-btn:hover{background:rgba(255,255,255,.14)}
header.scrolled .hdr-btn{border-color:var(--line);color:var(--ink)}
header.scrolled .hdr-btn:hover{background:#F7F5F0}
.hdr-btn.on{border-color:var(--gold);color:var(--gold);background:rgba(168,114,42,.08)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:94vh;background:var(--ink);color:#fff;display:flex;align-items:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(900px 520px at 72% 18%, rgba(168,114,42,.20), transparent 60%),
  radial-gradient(700px 500px at 18% 88%, rgba(255,255,255,.06), transparent 60%);}
.hero::after{content:"";position:absolute;inset:0;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px);background-size:100% 96px}
.hero .inner{position:relative;z-index:2;width:100%;max-width:var(--max);margin:0 auto;padding:120px 28px 80px}
.kicker{font-size:10.5px;letter-spacing:.34em;color:rgba(255,255,255,.5);margin-bottom:26px}
.hero h1{font-size:clamp(56px,9vw,120px);line-height:.96;letter-spacing:-.03em;font-weight:700}
.hero h1 .thin{display:block;font-weight:300;color:rgba(255,255,255,.42);font-size:.30em;letter-spacing:.14em;margin-top:26px}
.hero .lede{max-width:520px;margin-top:30px;font-size:15.5px;line-height:1.85;color:rgba(255,255,255,.62)}
.hero .actions{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap}
.btn{font:inherit;font-size:13.5px;padding:13px 22px;border-radius:999px;border:1px solid transparent;background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn.light{background:#fff;color:var(--ink)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.26);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.small{font-size:12px;padding:8px 14px}
.hero .meta{position:absolute;left:0;right:0;bottom:34px;z-index:2}
.hero .meta .wrap{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.38);letter-spacing:.14em}
.scroll-hint{position:absolute;right:28px;bottom:110px;z-index:2;font-size:10px;letter-spacing:.3em;color:rgba(255,255,255,.35);writing-mode:vertical-rl}

/* ---------- sections ---------- */
main{background:var(--paper)}
.band{background:var(--bg)}
section.pad{padding:104px 0}
.shead{margin-bottom:44px}
.shead .lab{font-size:10.5px;letter-spacing:.3em;color:var(--gold);margin-bottom:14px}
.shead h2{font-size:clamp(28px,3.4vw,44px);line-height:1.15;letter-spacing:-.02em;font-weight:700}
.shead p{margin-top:14px;color:var(--gray);max-width:560px;font-size:14.5px}
.shead.row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:34px 0 30px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat b{display:block;font-size:clamp(34px,4vw,52px);font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:10px;font-size:11.5px;letter-spacing:.16em;color:var(--light)}

/* table */
.table{width:100%;border-collapse:collapse}
.table th{font-size:10.5px;letter-spacing:.16em;color:var(--light);font-weight:400;text-align:left;padding:0 0 14px;border-bottom:1px solid var(--ink)}
.table td{padding:20px 0;border-bottom:1px solid var(--line);font-size:15px}
.table tr:hover td{background:#FAF9F6}
.table .rank{width:64px;color:var(--light);font-size:12px;font-variant-numeric:tabular-nums}
.table .top .rank{color:var(--gold);font-weight:600}
.table .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.table .neg{color:#A4453B}
.tag{display:inline-block;font-size:10.5px;color:var(--gray);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:1px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;transition:.25s}
.card:hover{border-color:#D3CEC3;transform:translateY(-2px)}
.card .no{font-size:10.5px;letter-spacing:.24em;color:var(--gold);margin-bottom:18px}
.card h3{font-size:17.5px;font-weight:600;line-height:1.4;letter-spacing:-.01em}
.card p{margin-top:10px;font-size:13px;color:var(--gray);line-height:1.75}
.card .foot{margin-top:22px;font-size:11.5px;color:var(--light)}

/* file list */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.filters button{font:inherit;font-size:12px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--gray);cursor:pointer}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.files{border-top:1px solid var(--ink)}
.file{display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.file .ic{width:40px;height:40px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:9.5px;letter-spacing:.06em;color:var(--gray);flex:none;font-weight:600}
.file .info{flex:1;min-width:0}
.file .info b{font-size:14.5px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .info small{color:var(--light);font-size:11.5px}
.file .go{font-size:12px;color:var(--gray);text-decoration:none;border:1px solid var(--line);padding:7px 13px;border-radius:999px;white-space:nowrap}
.file .go:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

/* sop */
.sop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.sop-col{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
.sop-col h3{font-size:13px;letter-spacing:.14em;color:var(--light);font-weight:500;margin-bottom:18px}
.sop-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.6}
.sop-item:last-child{border-bottom:none}
.sop-item .t{flex:none;font-size:10.5px;color:var(--gold);letter-spacing:.06em;padding-top:2px;min-width:44px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:36px}
.rule{border-top:1px solid var(--ink);padding-top:18px}
.rule b{display:block;font-size:15px;margin-bottom:6px}
.rule p{font-size:12.5px;color:var(--gray)}

/* about */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.about-grid h3{font-size:13px;letter-spacing:.14em;color:var(--light);margin-bottom:16px;font-weight:500}
.about-grid p{font-size:13.5px;color:var(--gray);margin-bottom:10px;line-height:1.8}
.about-grid ol{padding-left:18px;font-size:13.5px;color:var(--gray);line-height:1.9}
.about-grid a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.notice{border-left:2px solid var(--gold);padding:2px 0 2px 16px;font-size:12.5px;color:var(--gray);margin-top:18px}

/* empty */
.empty{padding:64px 0;text-align:center;color:var(--light);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px;font-weight:600}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(11,11,12,.55);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:80}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:480px;padding:30px;max-height:88vh;overflow:auto}
.modal h3{font-size:19px;letter-spacing:-.01em}
.modal p.hint{font-size:12px;color:var(--light);margin:8px 0 18px;line-height:1.7}
label{display:block;font-size:11.5px;color:var(--gray);margin:14px 0 6px;letter-spacing:.04em}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;font:inherit;font-size:14px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:100px;resize:vertical}
.modal .actions{display:flex;gap:10px;margin-top:24px}
.modal .actions .btn{flex:1;justify-content:center}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,10px);background:var(--ink);color:#fff;font-size:13px;padding:13px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#8E3B32}

/* footer */
footer{background:var(--ink);color:rgba(255,255,255,.5);padding:64px 0 40px}
footer .top{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
footer .brand b{color:#fff}
footer .brand small{color:rgba(255,255,255,.4)}
footer .cols{display:flex;gap:60px;flex-wrap:wrap}
footer h4{font-size:10.5px;letter-spacing:.22em;color:rgba(255,255,255,.35);font-weight:400;margin-bottom:12px}
footer a{display:block;font-size:12.5px;color:rgba(255,255,255,.62);text-decoration:none;margin-bottom:8px}
footer a:hover{color:#fff}
footer .base{margin-top:44px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;font-size:11px;flex-wrap:wrap;gap:8px}

/* reveal */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}
.reveal.in{opacity:1;transform:none}

@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat{border-bottom:1px solid var(--line)}
  .cards,.sop-grid,.rules{grid-template-columns:1fr}
  .about-grid{grid-template-columns:1fr;gap:36px}
  section.pad{padding:72px 0}
  .hero{min-height:88vh}
  nav{order:3;width:100%;overflow-x:auto;padding-bottom:4px}
  header .bar{padding:14px 20px;gap:14px}
  .scroll-hint{display:none}
}
@media print{ header,footer,.hero .actions{display:none} .hero{min-height:auto;background:#fff;color:#000} .hero h1{color:#000} }
</style>
</head>
<body>

<header id="hdr">
  <div class="bar">
    <a class="brand" href="#/">
      <span class="logo-slot">
        <img id="logoImg" alt="" src="assets/logo.png" onerror="this.style.display='none';document.getElementById('logoMark').style.display='block'">
        <span class="mark" id="logoMark">成</span>
      </span>
      <b>深源青创 · 成人之美<small>CHENG REN ZHI MEI</small></b>
    </a>
    <nav id="nav">
      <a href="#/" data-r="">首页</a>
      <a href="#/board" data-r="board">榜单</a>
      <a href="#/activities" data-r="activities">活动</a>
      <a href="#/members" data-r="members">成员</a>
      <a href="#/files" data-r="files">资料库</a>
      <a href="#/sop" data-r="sop">SOP</a>
      <a href="#/about" data-r="about">说明</a>
    </nav>
    <button class="hdr-btn" id="adminBtn">管理员登录</button>
  </div>
</header>

<main id="view"></main>

<footer>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="#/">
        <span class="logo-slot"><span class="mark" style="color:#fff">成</span></span>
        <b>深源青创 · 成人之美<small>CHENG REN ZHI MEI</small></b>
      </a>
      <div class="cols">
        <div><h4>快速进入</h4>
          <a href="#/board">积分榜</a><a href="#/activities">活动</a><a href="#/files">资料库</a></div>
        <div><h4>标准</h4>
          <a href="#/sop">活动 SOP</a>
          <a href="https://hoolexic-hxl.github.io/crzm-sop/" target="_blank" rel="noopener">SOP 网页版（对外）</a>
          <a href="#/about">管理员说明</a></div>
        <div><h4>系统</h4>
          <a href="https://github.com/hoolexic-hxl/crzm-app" target="_blank" rel="noopener">数据仓库</a>
          <a href="#/about">隐私说明</a></div>
      </div>
    </div>
    <div class="base">
      <span>© 2026 深源青创 · 成人之美　　运营后台由知之网络提供</span>
      <span id="syncState">—</span>
    </div>
  </div>
</footer>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 配置 ================= */
const CFG = {
  owner:'hoolexic-hxl', repo:'crzm-app', branch:'main',
  dataPath:'data/app.json', filesDir:'files',
  sopWeb:'https://hoolexic-hxl.github.io/crzm-sop/'
};
const API = 'https://api.github.com';
const TOKEN_KEY = 'crzm-admin-token';

let DATA = {meta:{},members:[],activities:[],records:[],files:[]};
let TOKEN = localStorage.getItem(TOKEN_KEY) || '';
let IS_ADMIN = false;
let FILE_FILTER = '全部';
let SYNC_SHA = null;

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fdate = d => d ? d.replace(/-/g,'.') : '';
const fsize = n => !n ? '' : (n > 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.round(n/1024)+' KB');

function toast(msg, err=false){
  const t = $('#toast'); t.textContent = msg;
  t.className = 'toast show' + (err?' err':'');
  clearTimeout(t._t); t._t = setTimeout(()=>t.className='toast', 2800);
}

/* ================= 数据 ================= */
async function loadData(){
  const urls = [
    `./${CFG.dataPath}?t=${Date.now()}`,
    `https://raw.githubusercontent.com/${CFG.owner}/${CFG.repo}/${CFG.branch}/${CFG.dataPath}?t=${Date.now()}`
  ];
  for (const u of urls){
    try{
      const r = await fetch(u, {cache:'no-store'});
      if (!r.ok) continue;
      const j = await r.json();
      DATA = Object.assign({meta:{},members:[],activities:[],records:[],files:[]}, j);
      $('#syncState').textContent = '数据已同步';
      return;
    }catch(e){}
  }
  $('#syncState').textContent = '离线模式';
}
const ghH = () => ({'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
async function ghSha(path){
  const r = await fetch(`${API}/repos/${CFG.owner}/${CFG.repo}/contents/${path}?ref=${CFG.branch}`,{headers:ghH()});
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('读取失败 '+r.status);
  return (await r.json()).sha || null;
}
const b64 = str => { const b = new TextEncoder().encode(str); let s=''; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s); };
async function ghPut(path, dataB64, msg){
  const sha = await ghSha(path);
  const body = {message:msg, content:dataB64, branch:CFG.branch};
  if (sha) body.sha = sha;
  const r = await fetch(`${API}/repos/${CFG.owner}/${CFG.repo}/contents/${path}`,{method:'PUT',headers:ghH(),body:JSON.stringify(body)});
  if (!r.ok){ const j = await r.json().catch(()=>({})); throw new Error((j.message||'写入失败')+' '+r.status); }
}
async function saveData(msg){
  await ghPut(CFG.dataPath, b64(JSON.stringify(DATA,null,2)), msg||'更新数据');
  $('#syncState').textContent = '已保存';
}
async function verifyAdmin(){
  if (!TOKEN){ IS_ADMIN=false; paintAdmin(); return; }
  try{
    const r = await fetch(`${API}/repos/${CFG.owner}/${CFG.repo}`,{headers:ghH()});
    if (!r.ok) throw new Error(r.status===401?'Token 无效':'无法访问仓库 '+r.status);
    IS_ADMIN = !!(await r.json()).permissions?.push;
    if (!IS_ADMIN) toast('Token 无写入权限', true);
  }catch(e){ IS_ADMIN=false; toast(e.message, true); }
  paintAdmin();
}
function paintAdmin(){
  const b = $('#adminBtn');
  b.textContent = IS_ADMIN ? '已登录 · 退出' : '管理员登录';
  b.classList.toggle('on', IS_ADMIN);
}

/* ================= 计算 ================= */
const TYPES = [
  {type:'signup', points:3, label:'报名 +3'},
  {type:'attended', points:10, label:'准时到场 +10'},
  {type:'contribution', points:8, label:'贡献 +8'},
  {type:'feedback', points:4, label:'复盘反馈 +4'},
  {type:'noshow', points:-8, label:'报名未到 -8'},
  {type:'custom', points:0, label:'自定义'}
];
const TLABEL = {signup:'报名',attended:'到场',noshow:'未到',contribution:'贡献',feedback:'反馈',custom:'自定义'};
const pts = id => DATA.records.filter(r=>r.memberId===id).reduce((s,r)=>s+Number(r.points||0),0);
const attended = id => new Set(DATA.records.filter(r=>r.memberId===id && r.type==='attended').map(r=>r.activityId)).size;
const thisMonth = () => DATA.activities.filter(a=>(a.date||'').slice(0,7)===new Date().toISOString().slice(0,7)).length;

/* ================= 页面 ================= */
function render(){
  const r = (location.hash || '#/').replace('#/','') || '';
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.r===r));
  const v = $('#view');
  if (r==='') v.innerHTML = viewHome();
  else if (r==='board') v.innerHTML = viewBoard();
  else if (r==='activities') v.innerHTML = viewActivities();
  else if (r==='members') v.innerHTML = viewMembers();
  else if (r==='files') v.innerHTML = viewFiles();
  else if (r==='sop') v.innerHTML = viewSop();
  else v.innerHTML = viewAbout();
  bindReveal(); window.scrollTo({top:0,behavior:'instant'});
  onScroll();
}

function hero(){
  return `
  <section class="hero">
    <div class="inner">
      <div class="kicker">深源青创 · 成人之美　/　ACTIVITY SYSTEM</div>
      <h1>成人之美<span class="thin">以美聚人 · 以创成事</span></h1>
      <p class="lede">成就事业 · 成就圈层 · 成就家庭 · 成就姻缘。<br>每一场活动都被记录，每一份贡献都被看见。</p>
      <div class="actions">
        <a class="btn light" href="#/board">查看积分榜</a>
        <a class="btn ghost" href="#/sop">活动 SOP</a>
      </div>
    </div>
    <div class="scroll-hint">SCROLL</div>

function openModal(html){ $('#modal').innerHTML = html; $('#modalBg').classList.add('show'); }
function closeModal(){ $('#modalBg').classList.remove('show'); $('#modal').innerHTML=''; }
$('#modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });
function guard(){ if(IS_ADMIN) return true; toast('请先登录管理员', true); openLogin(); return false; }
function openLogin(){
  openModal(`<h3>管理员登录</h3>
    <p class="hint">粘贴 GitHub 细粒度 Token（只授权本仓库 Contents 读写）。Token 仅保存在本机浏览器。</p>
    <label>GitHub Token</label><input type="password" id="tk" placeholder="github_pat_...">
    <div class="actions"><button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" onclick="doLogin()">验证并保存</button></div>
    <p class="hint" style="margin-top:14px">还没有 Token？见「说明」页的 5 步指引。</p>`);
  setTimeout(()=>$('#tk')?.focus(), 50);
}
async function doLogin(){
  const tk = ($('#tk').value||'').trim();
  if (!tk) return toast('请填写 Token', true);
  TOKEN = tk; localStorage.setItem(TOKEN_KEY, tk);
  await verifyAdmin();
  if (IS_ADMIN){ closeModal(); render(); toast('已登录管理员'); }
}
function logout(){ TOKEN=''; IS_ADMIN=false; localStorage.removeItem(TOKEN_KEY); paintAdmin(); render(); toast('已退出'); }
$('#adminBtn').addEventListener('click', ()=> IS_ADMIN ? logout() : openLogin());

function openMember(){
  if(!guard()) return;
  openModal(`<h3>添加成员</h3><p class="hint">昵称用于公开榜单展示。</p>
    <label>昵称 / 姓名</label><input type="text" id="mNick" placeholder="例如：荔">
    <label>真实姓名（选填，不公开）</label><input type="text" id="mName">
    <label>分组</label><input type="text" id="mGroup" placeholder="例如：统筹组 / 第 20 期">
    <div class="actions"><button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" onclick="addMember()">保存</button></div>`);
  setTimeout(()=>$('#mNick')?.focus(),50);
}
async function addMember(){
  const nick = ($('#mNick').value||'').trim();
  if(!nick) return toast('请填写昵称', true);
  DATA.members.push({id:uid('m'), nickname:nick, name:($('#mName').value||'').trim(), group:($('#mGroup').value||'').trim(), createdAt:new Date().toISOString().slice(0,10)});
  await commit('添加成员：'+nick); closeModal(); render();
}
function openImport(){
  if(!guard()) return;
  openModal(`<h3>批量导入成员</h3><p class="hint">每行一个：昵称,真实姓名,分组（后两项可留空）</p>
    <textarea id="imp" placeholder="金湖,K,统筹组&#10;Kaka Lin,,统筹组"></textarea>
    <div class="actions"><button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" onclick="doImport()">导入</button></div>`);
}
async function doImport(){
  const lines = ($('#imp').value||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(!lines.length) return toast('没有内容', true);
  lines.forEach(l=>{
    const [nick,name,group] = l.split(/[,，]/).map(s=>(s||'').trim());
    if(!nick) return;
    DATA.members.push({id:uid('m'), nickname:nick, name:name||'', group:group||'', createdAt:new Date().toISOString().slice(0,10)});
  });
  await commit('批量导入成员'); closeModal(); render();
}
function openActivity(){
  if(!guard()) return;
  openModal(`<h3>新增活动</h3>
    <label>活动名称</label><input type="text" id="aTitle" placeholder="例如：友友碰头会 · 第二期">
    <label>日期</label><input type="date" id="aDate" value="${new Date().toISOString().slice(0,10)}">
    <label>地点（选填）</label><input type="text" id="aPlace">
    <div class="actions"><button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" onclick="addActivity()">保存</button></div>`);
  setTimeout(()=>$('#aTitle')?.focus(),50);
}
async function addActivity(){
  const t = ($('#aTitle').value||'').trim();
  if(!t) return toast('请填写活动名称', true);
  DATA.activities.push({id:uid('a'), title:t, date:$('#aDate').value, place:($('#aPlace').value||'').trim(), createdAt:new Date().toISOString().slice(0,10)});
  await commit('新增活动：'+t); closeModal(); render();
}
function openRecord(activityId){
  if(!guard()) return;
  if(!DATA.members.length) return toast('先添加成员', true);
  if(!DATA.activities.length) return toast('先添加活动', true);
  const acts = [...DATA.activities].reverse().map(a=>`<option value="${a.id}" ${a.id===activityId?'selected':''}>${esc(a.title)} · ${fdate(a.date)}</option>`).join('');
  const mems = DATA.members.map(m=>`<option value="${m.id}">${esc(m.nickname||m.name)}</option>`).join('');
  openModal(`<h3>记一条积分</h3><p class="hint">选择活动、成员与类型即可。</p>
    <label>活动</label><select id="rAct">${acts}</select>
    <label>成员</label><select id="rMem">${mems}</select>
    <label>类型</label><select id="rType" onchange="syncPts()">${TYPES.map((t,i)=>`<option value="${i}">${esc(t.label)}</option>`).join('')}</select>
    <label>分值</label><input type="text" id="rPts" value="3">
    <label>备注（选填，不公开）</label><input type="text" id="rNote">
    <div class="actions"><button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" onclick="addRecord()">保存</button></div>`);
}
function syncPts(){ $('#rPts').value = TYPES[Number($('#rType').value)].points; }
async function addRecord(){
  const preset = TYPES[Number($('#rType').value)];
  const val = Number(($('#rPts').value||'0').trim());
  if (isNaN(val)) return toast('分值无效', true);
  DATA.records.push({id:uid('r'), activityId:$('#rAct').value, memberId:$('#rMem').value,
    type:preset.type, points:val, note:($('#rNote').value||'').trim(), createdAt:new Date().toISOString()});
  await commit('记分：'+preset.label); closeModal(); render();
}
function openUpload(){
  if(!guard()) return;
  openModal(`<h3>上传资料</h3><p class="hint">图片 / PDF / 表格 / 文档，单个 ≤ 20MB。</p>
    <label>选择文件</label><input type="file" id="upFile" multiple>
    <label>分类</label><select id="upCat">${CATS.filter(c=>c!=='全部').map(c=>`<option>${c}</option>`).join('')}</select>
    <div class="actions"><button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" id="upBtn" onclick="doUpload()">上传</button></div>
    <p class="hint" id="upHint" style="margin-top:10px"></p>`);
}
async function fileB64(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  let s=''; const chunk=0x8000;
  for(let i=0;i<buf.length;i+=chunk) s += String.fromCharCode.apply(null, buf.subarray(i,i+chunk));
  return btoa(s);
}
const safeName = n => n.replace(/[\/\\:*?"<>|]/g,'_').replace(/\s+/g,'-');
async function doUpload(){
  const files = Array.from($('#upFile').files||[]);
  if(!files.length) return toast('请选择文件', true);
  const cat = $('#upCat').value; const hint = $('#upHint');
  $('#upBtn').disabled = true;
  for(const f of files){
    if(f.size > 20*1024*1024){ toast(f.name+' 超过 20MB，跳过', true); continue; }
    hint.textContent = '正在上传 '+f.name+' …';
    try{
      const data = await fileB64(f);
      const ext = (f.name.split('.').pop()||'').toLowerCase();
      const path = `${CFG.filesDir}/${Date.now()}-${safeName(f.name)}`;
      await ghPut(path, data, '上传资料：'+f.name);
      DATA.files.push({name:f.name, path, category:cat, size:f.size, ext, uploadedAt:new Date().toISOString()});
      hint.textContent = f.name+' 已上传';
    }catch(e){ toast('上传失败：'+e.message, true); hint.textContent = '失败：'+e.message; }
  }
  await commit('更新资料清单'); $('#upBtn').disabled=false; closeModal(); render();
}
async function commit(msg){
  try{ await saveData(msg); toast('已保存 · '+msg); }
  catch(e){ toast('保存失败：'+e.message, true); }
}

/* ================= 视觉细节 ================= */
function onScroll(){
  const h = $('#hdr');
  const solid = (location.hash||'#/').replace('#/','') !== '';
  h.classList.toggle('scrolled', solid || window.scrollY > 40);
}
window.addEventListener('scroll', onScroll, {passive:true});

function bindReveal(){
  const els = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
  const io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  }, {threshold:.08});
  els.forEach(e=>io.observe(e));
}

window.addEventListener('hashchange', render);

(async function boot(){
  await loadData();
  if (TOKEN) await verifyAdmin();
  paintAdmin();
  render();
})();
</script>
</body>
</html>
