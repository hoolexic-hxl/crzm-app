<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>成人之美 · 深源青创</title>
<meta name="theme-color" content="#F19300">
<meta name="description" content="深源青创 · 成人之美 —— 活动系统：积分榜、活动、成员、资料库与活动 SOP。">
<link rel="icon" href="assets/favicon.png">
<style>
:root{
  --ink:#1E1206; --ink-2:#2B1B09; --paper:#FFFFFF; --bg:#FBF4E7;
  --gray:#6E5A43; --light:#9C8A72; --line:#EDE0C9; --line-dark:#3A2711;
  --gold:#C4720B; --gold-soft:#FCEFD8;
  --brand:#F19300; --brand-2:#EE8003; --brand-deep:#D97706;
  --max:1120px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--max);margin:0 auto;padding:0 28px}
a{color:inherit}
::selection{background:var(--ink);color:#fff}

/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:40;transition:.35s}
header .bar{max-width:var(--max);margin:0 auto;padding:18px 28px;display:flex;align-items:center;gap:28px}
header.scrolled{background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
header.scrolled .brand b, header.scrolled nav a{color:var(--ink)}
header.scrolled nav a.on{color:var(--gold)}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;margin-right:auto}
.logo-slot{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:none}
.logo-slot img{width:100%;height:100%;object-fit:contain;display:block}
.logo-slot .lg-brand{display:none}
header.scrolled .logo-slot .lg-ink{display:none}
header.scrolled .logo-slot .lg-brand{display:block}
.brand b{font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:.02em;line-height:1.3}
.brand small{display:block;font-size:9.5px;letter-spacing:.24em;color:rgba(30,18,6,.48);font-weight:400}
header.scrolled .brand small{color:var(--light)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{font-size:12.5px;color:rgba(30,18,6,.66);text-decoration:none;padding:7px 11px;border-radius:8px;transition:.2s;white-space:nowrap}
nav a:hover{color:var(--ink)}
header.scrolled nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink);background:rgba(30,18,6,.10)}
header.scrolled nav a.on{background:transparent;color:var(--gold);font-weight:600}
.hdr-btn{font:inherit;font-size:12px;padding:7px 13px;border-radius:8px;border:1px solid rgba(30,18,6,.28);background:transparent;color:var(--ink);cursor:pointer;transition:.2s}
.hdr-btn:hover{background:rgba(255,255,255,.35)}
header.scrolled .hdr-btn{border-color:var(--line);color:var(--ink)}
header.scrolled .hdr-btn:hover{background:#F7F5F0}
.hdr-btn.on{border-color:rgba(30,18,6,.5);color:var(--ink);background:rgba(255,255,255,.4)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:94vh;background:linear-gradient(135deg,#F7A61C 0%,var(--brand) 46%,#EC8500 100%);color:var(--ink);display:flex;align-items:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(900px 520px at 78% 12%, rgba(255,255,255,.28), transparent 62%),
  radial-gradient(760px 560px at 6% 94%, rgba(200,101,0,.30), transparent 60%);}
.hero::after{content:"";position:absolute;inset:0;opacity:.35;background-image:linear-gradient(rgba(30,18,6,.07) 1px, transparent 1px);background-size:100% 96px}
.hero-mark{position:absolute;right:-210px;top:50%;transform:translateY(-50%);width:720px;opacity:.05;z-index:1;pointer-events:none}
.hero-mark img{width:100%;display:block}
.hero .inner{position:relative;z-index:2;width:100%;max-width:var(--max);margin:0 auto;padding:120px 28px 80px}
.kicker{font-size:10.5px;letter-spacing:.34em;color:rgba(30,18,6,.62);margin-bottom:26px}
.hero h1{font-size:clamp(56px,9vw,120px);line-height:.96;letter-spacing:-.03em;font-weight:700}
.hero h1 .thin{display:block;font-weight:300;color:rgba(30,18,6,.64);font-size:.30em;letter-spacing:.14em;margin-top:26px}
.hero .lede{max-width:520px;margin-top:30px;font-size:15.5px;line-height:1.85;color:rgba(30,18,6,.8)}
.hero .actions{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap}
.btn{font:inherit;font-size:13.5px;padding:13px 22px;border-radius:999px;border:1px solid transparent;background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn.light{background:#fff;color:var(--ink)}
.btn.ghost{background:transparent;border-color:rgba(30,18,6,.32);color:var(--ink)}
.btn.ghost:hover{background:rgba(255,255,255,.4)}
.btn.small{font-size:12px;padding:8px 14px}
.hero .meta{position:absolute;left:0;right:0;bottom:34px;z-index:2}
.hero .meta .wrap{display:flex;justify-content:space-between;font-size:11px;color:rgba(30,18,6,.5);letter-spacing:.14em}
.scroll-hint{position:absolute;right:28px;bottom:110px;z-index:2;font-size:10px;letter-spacing:.3em;color:rgba(30,18,6,.45);writing-mode:vertical-rl}

/* ---------- sections ---------- */
main{background:var(--paper)}
.band{background:var(--bg)}
section.pad{padding:104px 0}
.shead{margin-bottom:44px}
.shead .lab{font-size:10.5px;letter-spacing:.3em;color:var(--gold);margin-bottom:14px}
.shead h2{font-size:clamp(28px,3.4vw,44px);line-height:1.15;letter-spacing:-.02em;font-weight:700}
.shead p{margin-top:14px;color:var(--gray);max-width:560px;font-size:14.5px}
.shead.row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:34px 0 30px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat b{display:block;font-size:clamp(34px,4vw,52px);font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:10px;font-size:11.5px;letter-spacing:.16em;color:var(--light)}

/* table */
.table{width:100%;border-collapse:collapse}
.table th{font-size:10.5px;letter-spacing:.16em;color:var(--light);font-weight:400;text-align:left;padding:0 0 14px;border-bottom:1px solid var(--ink)}
.table td{padding:20px 0;border-bottom:1px solid var(--line);font-size:15px}
.table tr:hover td{background:#FAF9F6}
.table .rank{width:64px;color:var(--light);font-size:12px;font-variant-numeric:tabular-nums}
.table .top .rank{color:var(--gold);font-weight:600}
.table th:nth-child(3),.table td:nth-child(3){width:150px}
.table th:nth-child(4),.table td:nth-child(4){width:120px}
.table .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.table .neg{color:#A4453B}
.tag{display:inline-block;font-size:10.5px;color:var(--gray);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:1px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;transition:.25s}
.card:hover{border-color:#D3CEC3;transform:translateY(-2px)}
.card .no{font-size:10.5px;letter-spacing:.24em;color:var(--gold);margin-bottom:18px}
.card h3{font-size:17.5px;font-weight:600;line-height:1.4;letter-spacing:-.01em}
.card p{margin-top:10px;font-size:13px;color:var(--gray);line-height:1.75}
.card .foot{margin-top:22px;font-size:11.5px;color:var(--light)}

/* file list */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.filters button{font:inherit;font-size:12px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--gray);cursor:pointer}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.files{border-top:1px solid var(--ink)}
.file{display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.file .ic{width:40px;height:40px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:9.5px;letter-spacing:.06em;color:var(--gray);flex:none;font-weight:600}
.file .info{flex:1;min-width:0}
.file .info b{font-size:14.5px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .info small{color:var(--light);font-size:11.5px}
.file .go{font-size:12px;color:var(--gray);text-decoration:none;border:1px solid var(--line);padding:7px 13px;border-radius:999px;white-space:nowrap}
.file .go:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

/* sop */
.sop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.sop-col{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
.sop-col h3{font-size:13px;letter-spacing:.14em;color:var(--light);font-weight:500;margin-bottom:18px}
.sop-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.6}
.sop-item:last-child{border-bottom:none}
.sop-item .t{flex:none;font-size:10.5px;color:var(--gold);letter-spacing:.06em;padding-top:2px;min-width:44px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:36px}
.rule{border-top:1px solid var(--ink);padding-top:18px}
.rule b{display:block;font-size:15px;margin-bottom:6px}
.rule p{font-size:12.5px;color:var(--gray)}

/* about */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.about-grid h3{font-size:13px;letter-spacing:.14em;color:var(--light);margin-bottom:16px;font-weight:500}
.about-grid p{font-size:13.5px;color:var(--gray);margin-bottom:10px;line-height:1.8}
.about-grid ol{padding-left:18px;font-size:13.5px;color:var(--gray);line-height:1.9}
.about-grid a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.notice{border-left:2px solid var(--gold);padding:2px 0 2px 16px;font-size:12.5px;color:var(--gray);margin-top:18px}

/* empty */
.empty{padding:64px 0;text-align:center;color:var(--light);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px;font-weight:600}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(11,11,12,.55);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:80}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:480px;padding:30px;max-height:88vh;overflow:auto}
.modal h3{font-size:19px;letter-spacing:-.01em}
.modal p.hint{font-size:12px;color:var(--light);margin:8px 0 18px;line-height:1.7}
label{display:block;font-size:11.5px;color:var(--gray);margin:14px 0 6px;letter-spacing:.04em}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;font:inherit;font-size:14px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:100px;resize:vertical}
.modal .actions{display:flex;gap:10px;margin-top:24px}
.modal .actions .btn{flex:1;justify-content:center}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,10px);background:var(--ink);color:#fff;font-size:13px;padding:13px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#8E3B32}

/* footer */
footer{background:linear-gradient(180deg,var(--brand) 0%,var(--brand-2) 100%);color:rgba(30,18,6,.66);padding:64px 0 40px}
footer .top{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
footer .logo-slot{width:32px;height:32px}
footer .brand b{color:var(--ink)}
footer .brand small{color:rgba(30,18,6,.45)}
footer .cols{display:flex;gap:60px;flex-wrap:wrap}
footer h4{font-size:10.5px;letter-spacing:.22em;color:rgba(30,18,6,.45);font-weight:400;margin-bottom:12px}
footer a{display:block;font-size:12.5px;color:rgba(30,18,6,.7);text-decoration:none;margin-bottom:8px}
footer a:hover{color:var(--ink)}
footer .base{margin-top:44px;padding-top:20px;border-top:1px solid rgba(30,18,6,.18);display:flex;justify-content:space-between;font-size:11px;flex-wrap:wrap;gap:8px}

/* people / private */
.people th:nth-child(2),.people td:nth-child(2){width:66px}
.people th:nth-child(3),.people td:nth-child(3){width:62px}
.people th:nth-child(4),.people td:nth-child(4){width:150px}
.people th:nth-child(6),.people td:nth-child(6){width:150px}
.people th:nth-child(7),.people td:nth-child(7){width:58px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.toolbar input[type=text]{max-width:230px}
.toolbar select{width:auto;min-width:120px;max-width:190px}
.toolbar .count{margin-left:auto;font-size:11.5px;color:var(--light);letter-spacing:.1em}
.locked{border:1px solid var(--line);border-radius:18px;padding:56px 30px;text-align:center;background:linear-gradient(180deg,#FFFDF8,#FBF4E7)}
.locked b{display:block;font-size:17px;margin-bottom:8px}
.locked p{color:var(--gray);font-size:13.5px;max-width:460px;margin:0 auto 20px}
.photo{width:108px;height:108px;border-radius:14px;object-fit:cover;background:#F4EBDD;flex:none}
.kv{display:grid;grid-template-columns:104px 1fr;gap:12px 18px;font-size:13.5px;margin:6px 0 4px}
.kv dt{color:var(--light);font-size:11px;letter-spacing:.1em;padding-top:3px}
.kv dd{color:var(--ink);line-height:1.65;white-space:pre-line}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--gray)}
.pick{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-top:8px}
.pick label{display:flex;align-items:center;gap:10px;margin:0;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);letter-spacing:0}
.pick label:last-child{border-bottom:none}
.pick input[type=checkbox]{width:16px;height:16px;accent-color:#1E1206;flex:none}
.small-muted{font-size:11.5px;color:var(--light)}
.retro-tag{font-size:10.5px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:1px 8px;margin-left:8px}
.retro-tag.todo{color:var(--light);border-color:var(--line)}
.cards.two{grid-template-columns:repeat(2,1fr)}
@media (max-width:900px){ .cards.two{grid-template-columns:1fr} }

/* 匹配台 */
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#fff;margin-bottom:22px}
.tabs button{font:inherit;font-size:12px;padding:7px 16px;border:none;background:transparent;border-radius:999px;color:var(--gray);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.mrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex:none}
.mrow .who{flex:1;min-width:0}
.mrow .who b{font-size:14.5px;font-weight:600}
.mrow .who small{display:block;color:var(--light);font-size:11.5px;margin-top:2px}
.mrow .pts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
.mchip{font-size:10.5px;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:2px 8px;white-space:nowrap}
.mrow .act{flex:none}
.mtarget{display:flex;gap:14px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#FFFDF9,#FBF4E7);margin-bottom:18px}
.mtarget select{flex:1;max-width:360px}
.matchgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.mcard{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.mcard .who b{font-size:14px}
.mcard .who small{display:block;color:var(--light);font-size:11.5px;margin-top:3px;line-height:1.6}
@media (max-width:900px){ .matchgrid{grid-template-columns:1fr} .mrow .pts{display:none} }

/* reveal */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}
.reveal.in{opacity:1;transform:none}

@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat{border-bottom:1px solid var(--line)}
  .cards,.sop-grid,.rules{grid-template-columns:1fr}
  .about-grid{grid-template-columns:1fr;gap:36px}
  section.pad{padding:72px 0}
  .hero{min-height:88vh}
  nav{order:3;width:100%;overflow-x:auto;padding-bottom:4px}
  header .bar{padding:14px 20px;gap:14px}
  .scroll-hint{display:none}
}
@media print{ header,footer,.hero .actions{display:none} .hero{min-height:auto;background:#fff;color:#000} .hero h1{color:#000} }
</style>
</head>
<body>

<header id="hdr">
  <div class="bar">
    <a class="brand" href="#/">
      <span class="logo-slot">
        <img class="lg lg-ink" src="assets/logo-ink.png" alt="成人之美">
        <img class="lg lg-brand" src="assets/logo-brand.png" alt="">
      </span>
      <b>深源青创 · 成人之美<small>CHENG REN ZHI MEI</small></b>
    </a>
    <nav id="nav">
      <a href="#/" data-r="">首页</a>
      <a href="#/board" data-r="board">榜单</a>
      <a href="#/activities" data-r="activities">活动</a>
      <a href="#/members" data-r="members">成员</a>
      <a href="#/people" data-r="people">人才库</a>
      <a href="#/files" data-r="files">资料库</a>
      <a href="#/sop" data-r="sop">SOP</a>
    </nav>
    <button class="hdr-btn" id="adminBtn">管理员登录</button>
  </div>
</header>

<main id="view"></main>

<footer>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="#/">
        <span class="logo-slot"><img src="assets/logo-ink.png" alt="成人之美"></span>
        <b>深源青创 · 成人之美<small>CHENG REN ZHI MEI</small></b>
      </a>
      <div class="cols">
        <div><h4>快速进入</h4>
          <a href="#/board">积分榜</a><a href="#/activities">活动</a>
          <a href="#/people">人才库</a><a href="#/files">资料库</a></div>
        <div><h4>标准</h4>
          <a href="#/sop">活动 SOP</a>
          <a href="https://hoolexic-hxl.github.io/crzm-sop/" target="_blank" rel="noopener">SOP 网页版（对外）</a>
          <a href="#/about">管理员说明</a></div>
        <div><h4>系统</h4>
          <a href="https://github.com/hoolexic-hxl/crzm-app" target="_blank" rel="noopener">公开数据仓库</a>
          <a href="#/about">隐私说明</a><a href="#/about">管理员说明</a></div>
      </div>
    </div>
    <div class="base">
      <span>© 2026 深源青创 · 成人之美　　运营后台由知之网络提供</span>
      <span id="syncState">—</span>
    </div>
  </div>
</footer>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 配置 ================= */
const CFG = {
  owner:'hoolexic-hxl', repo:'crzm-app', branch:'main',
  dataPath:'data/app.json', filesDir:'files',
  sopWeb:'https://hoolexic-hxl.github.io/crzm-sop/'
};
const API = 'https://api.github.com';
const TOKEN_KEY = 'crzm-admin-token';

let DATA = {meta:{},members:[],activities:[],records:[],files:[]};
let TOKEN = localStorage.getItem(TOKEN_KEY) || '';
let IS_ADMIN = false;
let FILE_FILTER = '全部';
let SYNC_SHA = null;

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, err=false){
  const t = $('#toast'); t.textContent = msg;
  t.className = 'toast show' + (err?' err':'');
  clearTimeout(t._t); t._t = setTimeout(()=>t.className='toast', 2800);
}

/* ================= 数据 ================= */
async function loadData(){
  const urls = [
    `./${CFG.dataPath}?t=${Date.now()}`,
    `https://raw.githubusercontent.com/${CFG.owner}/${CFG.repo}/${CFG.branch}/${CFG.dataPath}?t=${Date.now()}`
  ];
  for (const u of urls){
    try{
      const r = await fetch(u, {cache:'no-store'});
      if (!r.ok) continue;
      const j = await r.json();
      DATA = Object.assign({meta:{},members:[],activities:[],records:[],files:[]}, j);
      $('#syncState').textContent = '数据已同步';
      return;
    }catch(e){}
  }
  $('#syncState').textContent = '离线模式';
}
const ghH = () => ({'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
async function ghSha(path){
  const r = await fetch(`${API}/repos/${CFG.owner}/${CFG.repo}/contents/${path}?ref=${CFG.branch}`,{headers:ghH()});
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('读取失败 '+r.status);
  return (await r.json()).sha || null;
}
const b64 = str => { const b = new TextEncoder().encode(str); let s=''; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s); };
async function ghPut(path, dataB64, msg){
  const sha = await ghSha(path);
  const body = {message:msg, content:dataB64, branch:CFG.branch};
  if (sha) body.sha = sha;
  const r = await fetch(`${API}/repos/${CFG.owner}/${CFG.repo}/contents/${path}`,{method:'PUT',headers:ghH(),body:JSON.stringify(body)});
  if (!r.ok){ const j = await r.json().catch(()=>({})); throw new Error((j.message||'写入失败')+' '+r.status); }
}
async function saveData(msg){
  await ghPut(CFG.dataPath, b64(JSON.stringify(DATA,null,2)), msg||'更新数据');
  $('#syncState').textContent = '已保存';
}
async function verifyAdmin(){
  if (!TOKEN){ IS_ADMIN=false; paintAdmin(); return; }
  try{
    const r = await fetch(`${API}/repos/${CFG.owner}/${CFG.repo}`,{headers:ghH()});
    if (!r.ok) throw new Error(r.status===401?'Token 无效':'无法访问仓库 '+r.status);
    IS_ADMIN = !!(await r.json()).permissions?.push;
    if (!IS_ADMIN) toast('Token 无写入权限', true);
  }catch(e){ IS_ADMIN=false; toast(e.message, true); }
  paintAdmin();
}
function paintAdmin(){
  const b = $('#adminBtn');
  b.textContent = IS_ADMIN ? '已登录 · 退出' : '管理员登录';
  b.classList.toggle('on', IS_ADMIN);
}

async function ghGetRepo(repo, path){
  const r = await fetch(`${API}/repos/${CFG.owner}/${repo}/contents/${path}?ref=main&t=${Date.now()}`,
    {headers:ghH(), cache:'no-store'});
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`读取 ${repo}/${path} 失败 ${r.status}`);
  const j = await r.json();
  const bin = atob((j.content||'').replace(/\n/g,''));
  const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
  return {sha:j.sha, data: JSON.parse(new TextDecoder().decode(bytes))};
}
async function ghPutRepo(repo, path, text, msg, sha){
  const body = {message:msg, content:b64(text), branch:'main'};
  if (sha) body.sha = sha;
  const r = await fetch(`${API}/repos/${CFG.owner}/${repo}/contents/${path}`,
    {method:'PUT', headers:ghH(), body:JSON.stringify(body)});
  if (!r.ok){ const j = await r.json().catch(()=>({})); throw new Error((j.message||'写入失败')+' '+r.status); }
  const j = await r.json(); return j.content.sha;
}
async function loadPrivate(){
  PRIV_READY = false;
  try{
    const p = await ghGetRepo(PRIV.repo, PRIV.peoplePath);
    if (p){ PEOPLE = p.data; PEOPLE._sha = p.sha; }
    const r = await ghGetRepo(PRIV.repo, PRIV.retroPath);
    if (r){ RETROS = r.data; RETROS._sha = r.sha; }
    const m = await ghGetRepo(PRIV.repo, 'matches.json');
    if (m){ MATCHES = m.data; MATCHES._sha = m.sha; }
    PRIV_READY = true;
  }catch(e){ console.warn('private load failed', e); PRIV_READY = false; }
  return PRIV_READY;
}

}
async function saveMatches(msg){

async function saveRetros(msg){

}
const ageOf = p => {
  if (!p.birth) return null;
  const y = +String(p.birth).slice(0,4), m = +String(p.birth).slice(5,7) || 1;
  const now = new Date();
  let a = now.getFullYear() - y;
  if (now.getMonth()+1 < m) a--;
  return a > 0 && a < 100 ? a : null;
};
const pname = p => p.nickname || p.name || '未命名';
const ptitle = p => [p.company, p.title].filter(Boolean).join(' · ');
function filteredPeople(){
  const q = (PF.q||'').trim().toLowerCase();
  return (PEOPLE.people||[]).filter(p=>{
    if (PF.gender === '?' ? !!p.gender : (PF.gender && p.gender !== PF.gender)) return false;
    if (PF.edu && p.education !== PF.edu) return false;
    if (PF.industry && p.industry !== PF.industry) return false;
    if (PF.cohort && p.cohort !== PF.cohort) return false;
    if (PF.age){
      const a = ageOf(p); if (!a) return false;
      const [lo,hi] = PF.age.split('-').map(Number);
      if (a < lo || a > (hi||200)) return false;
    }
    if (q){
      const s = [p.nickname,p.name,p.company,p.title,p.industry,p.phone,p.wechat,p.expect,p.note,(p.tags||[]).join(' ')].join(' ').toLowerCase();
      if (!s.includes(q)) return false;
    }
    return true;
  });
}

function viewSop(){
  const before = [
    ['T-14','方案定稿：主题 / 时间 / 地点 / 人数上限（大型活动提前 30 天）'],
    ['T-10','前宣启动：海报 + 社群推送，报名信息统一收'],
    ['T-7','分工宣贯：行动计划过一遍，一人一岗定到人'],
    ['T-1','双提醒：给参与者发地址 / 交通 / 开始时间 / 取消规则；物料清点'],
    ['T-0','提前到位：场地布置完成、签到台就位']
  ];
  const during = [
    ['−60′','志愿者到场：布置收尾，碰头 5 分钟过一遍第一个小时'],
    ['−15′','开放签到：签到表 + 姓名贴 + 笔，记录到场'],

async function loadPhoto(path){
  const img = document.getElementById('pPhoto');
  if (!img) return;
  try{
    const r = await fetch(`${API}/repos/${CFG.owner}/${PRIV.repo}/contents/${path}?ref=main&t=${Date.now()}`,

    img.src = URL.createObjectURL(await r.blob());
  }catch(e){}

async function savePerson(id){
  const g = k => (document.getElementById('pf_'+k)?.value || '').trim();
  const name = g('name') || g('nickname');
  if (!name) return toast('至少填姓名或昵称', true);
  const tags = g('tags').split(/[,，、]/).map(t=>t.trim()).filter(Boolean);
  const rec = {
    name:g('name'), nickname:g('nickname'), gender:g('gender')==='—'?'':g('gender'),
    birth:g('birth'), phone:g('phone'), wechat:g('wechat'), company:g('company'),
    title:g('title'), industry:g('industry'), cohort:g('cohort'), expect:g('expect'),
    hometown:g('hometown'), school:g('school'), education:g('education')==='—'?'':g('education'),
    dinner:g('dinner')==='—'?'':g('dinner'), eta:g('eta'),
    source:g('source'), tags, note:g('note'), genderGuess:false
  };
  if (id){
    const p = PEOPLE.people.find(x=>x.id===id); Object.assign(p, rec);
  } else {
    PEOPLE.people.unshift(Object.assign({id:uid('p'), activities:[], createdAt:new Date().toISOString().slice(0,10)}, rec));
  }
  try{ await savePeople((id?'更新':'添加')+'人才：'+name); toast('已保存'); closeModal(); render(); }
  catch(e){ toast('保存失败：'+e.message, true); }
}

async function doImportPeople(){
  const lines = (document.getElementById('impPeople').value||'').split('\n').map(l=>l.trim()).filter(Boolean);
  if (!lines.length) return toast('没有内容', true);
  let n = 0;
  lines.forEach(l=>{
    const c = l.split(/\t|,|，/).map(x=>x.trim());

/* ---------- 匹配台 ---------- */
const ageGapOk = (a, b, gap) => {
  const x = ageOf(a), y = ageOf(b);
  if (!x || !y) return false;
  return Math.abs(x - y) <= Number(gap);
};
function matchScore(t, p){
  const chips = [];
  const ax = ageOf(t), bx = ageOf(p);
  if (ax && bx) chips.push(Math.abs(ax-bx)+'岁差');
  if (t.hometown && p.hometown && t.hometown === p.hometown) chips.push('同祖籍·'+p.hometown);
  if (t.education && p.education && t.education === p.education) chips.push('同学历·'+p.education);
  if (t.industry && p.industry && t.industry === p.industry) chips.push('同行业');
  if (t.cohort && p.cohort && t.cohort === p.cohort) chips.push('同期·'+p.cohort+'期');
  if (!chips.length) chips.push('新面孔');
  return chips;
}
function candidatesFor(t){
  const same = MATCHES.matches || [];
  return (PEOPLE.people||[]).filter(p=>{
    if (!p.gender || !t.gender) return false;
    if (p.gender === t.gender) return false;
    if (p.id === t.id) return false;
    if (!ageGapOk(t, p, MF.gap)) return false;
    if (MF.edu && p.education !== MF.edu) return false;
    if (MF.hometown && p.hometown !== MF.hometown) return false;
    if (MF.industry && p.industry !== MF.industry) return false;
    return true;
  }).sort((a,b)=>{
    const s = x => (x.hometown===t.hometown?2:0)+(x.education===t.education?1:0)+(x.cohort&&x.cohort===t.cohort?1:0);
    return s(b)-s(a);
  });
}

          ${['已介绍','跟进中','已见面','成','未成'].map(x=>`<option ${m.status===x?'selected':''}>${x}</option>`).join('')}
        </select>
      </div>`;
    }).join(''):'<div class="empty">还没有配对记录 · 从上面的候选里点「记为候选」</div>'}
  </div>`;
}

async function fileB64(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  let s=''; const chunk=0x8000;
  for(let i=0;i<buf.length;i+=chunk) s += String.fromCharCode.apply(null, buf.subarray(i,i+chunk));
  return btoa(s);
}
const safeName = n => n.replace(/[\/\\:*?"<>|]/g,'_').replace(/\s+/g,'-');
async function doUpload(){
  const files = Array.from($('#upFile').files||[]);
  if(!files.length) return toast('请选择文件', true);
  const cat = $('#upCat').value; const hint = $('#upHint');
  $('#upBtn').disabled = true;
  for(const f of files){
    if(f.size > 20*1024*1024){ toast(f.name+' 超过 20MB，跳过', true); continue; }
    hint.textContent = '正在上传 '+f.name+' …';
    try{
      const data = await fileB64(f);
      const ext = (f.name.split('.').pop()||'').toLowerCase();
      const path = `${CFG.filesDir}/${Date.now()}-${safeName(f.name)}`;
      await ghPut(path, data, '上传资料：'+f.name);
      DATA.files.push({name:f.name, path, category:cat, size:f.size, ext, uploadedAt:new Date().toISOString()});
      hint.textContent = f.name+' 已上传';
    }catch(e){ toast('上传失败：'+e.message, true); hint.textContent = '失败：'+e.message; }
  }
  await commit('更新资料清单'); $('#upBtn').disabled=false; closeModal(); render();
}
async function commit(msg){
  try{ await saveData(msg); toast('已保存 · '+msg); }
  catch(e){ toast('保存失败：'+e.message, true); }
}

function bindReveal(){
  const els = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
  const io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  }, {threshold:.08});
  els.forEach(e=>io.observe(e));
}

window.addEventListener('hashchange', render);

(async function boot(){
  await loadData();
  if (TOKEN){ await verifyAdmin(); if (IS_ADMIN) await loadPrivate(); }
  paintAdmin();
  render();
})();
</script>
